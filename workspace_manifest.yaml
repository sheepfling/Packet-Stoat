  - id: cesium-unreal
    label: Cesium Unreal
    preferred_version: "5.7"
    supported_versions:
      - version: "5.7"
        status: preferred
        notes: Current preferred Cesium packaging lane while the broader Unreal workspace still tracks both supported minors.
      - version: "5.8"
        status: supported
        notes: Supported Cesium compatibility lane that still needs explicit vendor-side proof on each host.
    package_paths:
      - build/unreal_vendor_plugins
      - artifacts/reports/unreal_vendor_plugin
    proof_kinds:
      - build-proof
      - packaging-proof
    hooks:
      discover:
        status: supported
        command: python tools/unreal_vendor_workflow.py discover
      doctor:
        status: supported
        command: python tools/unreal_vendor_workflow.py doctor --vendor cesium
        notes: Checks the configured Cesium plugin root plus any supported Unreal install visible on this host.
        requirements:
          - requirement_kind: env
            name: FASTDIS_CESIUM_PLUGIN_ROOT
            reason: Cesium vendor packaging needs a plugin checkout root to inspect.
            blocking: true
            remediation:
              - Set FASTDIS_CESIUM_PLUGIN_ROOT to the local Cesium for Unreal plugin root.
          - requirement_kind: engine
            engine: unreal
            version_policy: broad
            supported_versions: ["5.7", "5.8"]
            reason: Cesium vendor checks are only tracked on the supported Unreal lanes.
            blocking: true
            remediation:
              - Install Unreal Engine 5.7 or 5.8, or point discovery overrides at one of those installs before running Cesium hooks.
      bootstrap:
        status: unsupported
        notes: This selective Cesium route only proves vendor plugin packageability.
      build:
        status: supported
        command: python tools/unreal_vendor_workflow.py build --vendor cesium --engine-version {preferred_surface_version}
        notes: Packages the Cesium plugin on the preferred Unreal lane.
        requirements:
          - requirement_kind: env
            name: FASTDIS_CESIUM_PLUGIN_ROOT
            reason: Cesium packaging needs a plugin checkout root to package.
            blocking: true
            remediation:
              - Set FASTDIS_CESIUM_PLUGIN_ROOT to the local Cesium for Unreal plugin root.
          - requirement_kind: engine
            engine: unreal
            version_policy: exact-minor
            supported_versions: ["{preferred_surface_version}"]
            reason: The default Cesium package hook is pinned to the preferred UE {preferred_surface_version} lane.
            blocking: true
            remediation:
              - Install Unreal Engine {preferred_surface_version} or point discovery overrides at a UE {preferred_surface_version} install before running the Cesium package hook.
      verify:
        status: unsupported
        notes: This selective Cesium route does not claim runtime verification inside a host project yet.
      demo:
        status: unsupported
        notes: This selective Cesium route does not own a demo/runtime lane.
      full:
        status: supported
        command: python tools/unreal_vendor_workflow.py full --vendor cesium
        notes: Runs the supported Unreal version matrix for the Cesium plugin, including scratch-project install smoke after packaging.
        requirements:
          - requirement_kind: env
            name: FASTDIS_CESIUM_PLUGIN_ROOT
            reason: Cesium packaging needs a plugin checkout root to package.
            blocking: true
            remediation:
              - Set FASTDIS_CESIUM_PLUGIN_ROOT to the local Cesium for Unreal plugin root.
          - requirement_kind: engine
            engine: unreal
            version_policy: broad
            supported_versions: ["5.7", "5.8"]
            reason: The Cesium matrix lane tracks the supported Unreal minors.
            blocking: true
            remediation:
              - Install Unreal Engine 5.7 or 5.8, or point discovery overrides at one of those installs before running the Cesium matrix hook.
      package:
        status: supported
        command: python tools/unreal_vendor_workflow.py package --vendor cesium --engine-version {preferred_surface_version}
        notes: Alias of the preferred-lane Cesium package build.
        requirements:
          - requirement_kind: env
            name: FASTDIS_CESIUM_PLUGIN_ROOT
            reason: Cesium packaging needs a plugin checkout root to package.
            blocking: true
            remediation:
              - Set FASTDIS_CESIUM_PLUGIN_ROOT to the local Cesium for Unreal plugin root.
          - requirement_kind: engine
            engine: unreal
            version_policy: exact-minor
            supported_versions: ["{preferred_surface_version}"]
            reason: The default Cesium package hook is pinned to the preferred UE {preferred_surface_version} lane.
            blocking: true
            remediation:
              - Install Unreal Engine {preferred_surface_version} or point discovery overrides at a UE {preferred_surface_version} install before running the Cesium package hook.
      install-smoke:
        status: supported
        command: python tools/unreal_vendor_workflow.py install-smoke --vendor cesium --engine-version {preferred_surface_version}
        notes: Installs the packaged Cesium plugin into a clean scratch project and verifies the editor reaches the smoke script.
        requirements:
          - requirement_kind: env
            name: FASTDIS_CESIUM_PLUGIN_ROOT
            reason: Cesium install smoke needs the plugin checkout root to locate the packaged output path consistently.
            blocking: true
            remediation:
              - Set FASTDIS_CESIUM_PLUGIN_ROOT to the local Cesium for Unreal plugin root.
          - requirement_kind: engine
            engine: unreal
            version_policy: exact-minor
            supported_versions: ["{preferred_surface_version}"]
            reason: The default Cesium install-smoke hook is pinned to the preferred UE {preferred_surface_version} lane.
            blocking: true
            remediation:
              - Install Unreal Engine {preferred_surface_version} or point discovery overrides at a UE {preferred_surface_version} install before running the Cesium install-smoke hook.

