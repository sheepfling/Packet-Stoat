schema: packet_stoat.workspace_manifest.v1
workspace:
  id: packet-stoat
  name: Packet Stoat
  core_package: fastdis
  python_package: fastdis
  product_trees:
    - id: fastdis
      label: FastDIS
      role: Primary work product
      owns:
        - Native DIS core, C ABI, Python package, and engine-consumable artifacts.
        - Measurement proofs, orientation proofs, release bundles, DLLs, wheels, and parity evidence.
        - Example projects that demonstrate FastDIS behavior when the examples are owned by FastDIS rather than a third-party vendor.
      primary_paths:
        - src/fastdis
        - include/fastdis
        - packages
        - benchmarks
        - examples
        - artifacts
        - verification_reports
    - id: grill-dis
      label: GRILL DIS
      role: Competitor parity and comparison tree
      owns:
        - Competitor baselines, measurement proofs, compatibility captures, and parity reports.
        - Engine-limited comparison lanes used to track leading-edge engine compatibility.
        - Upstream-facing PR packets and evidence bundles prepared for GRILL DIS maintainers.
      primary_paths:
        - artifacts/verification_reports
        - tools
        - tests
        - docs/research
    - id: cesium
      label: Cesium
      role: Vendor dependency and example-project tree
      owns:
        - Cesium vendor plugin compatibility lanes and source-route preparation.
        - Killer-app example-project standards and showcase routes that depend on Cesium.
        - Upstream-facing installability fixes and evidence bundles prepared for Cesium maintainers.
      primary_paths:
        - extensions/cesium
        - external/cesium
        - docs/CESIUM_EXAMPLE_STANDARD.md
        - docs/research/CESIUM_SOURCE_ROUTE.md
    - id: fastdis-lattice
      label: FastDIS Lattice
      role: Adapter package and surrogate verification tree
      owns:
        - The packet-stoat-lattice adapter package, conversion seams, ingress/egress helpers, and optional real Lattice SDK bindings.
        - Zorn-compatible surrogate verification lanes used when live Lattice access is credential blocked.
        - Lattice-specific proofs, package builds, contract audits, and adapter-owned fixtures/examples.
      primary_paths:
        - packages/lattice
        - tools/lattice_workflow.py
        - tools/lattice_zorn_bridge.py
        - tools/lattice_zorn_rest_sdk_probe.py
        - tools/lattice_sample_parity_audit.py

cross_platform_policy:
  default:
    - "Windows target from macOS/Linux: canonical backend is MinGW-w64 via CMake toolchain swap; Docker is not treated as a first-class Windows artifact route."
    - "Linux target from Windows: canonical backends are direct CMake cross-compile or Docker fallback when the direct toolchain is missing."
    - "macOS target from non-macOS hosts: unsupported unless a dedicated lane is added explicitly."
  windows:
    - This Windows host should light up Linux direct and Linux Docker separately, not as a single generic cross-build bucket.
  macos:
    - This host should prefer MinGW-w64 for Windows targets and avoid implying a Docker-backed Windows target lane.
  linux:
    - This host should prefer MinGW-w64 for Windows targets and avoid implying a Docker-backed Windows target lane.

next_steps:
  - packet-stoat bootstrap doctor
  - fastdis-lattice doctor
  - fastdis-engine godot doctor
  - fastdis-engine unity doctor
  - fastdis-engine unreal doctor
  - python tools/windows_wheel_workflow.py doctor

canonical_surface_hooks:
  - discover
  - doctor
  - bootstrap
  - build
  - verify
  - demo
  - full
  - package
  - install-smoke

canonical_hook_categories:
  discover: lifecycle
  doctor: lifecycle
  bootstrap: lifecycle
  build: proof
  verify: proof
  demo: demo
  full: proof
  package: packaging
  install-smoke: install

route_task_templates:
  fastdis-bootstrap:
    id: "{route_id}-bootstrap"
    label: "{route_label} Bootstrap"
    stage: bootstrap
    route_family: fastdis
    parallel_safe: false
    commands:
      - "{bootstrap_command}"
  fastdis-discover:
    id: "{route_id}-discover"
    label: "{route_label} Discover"
    stage: discover
    route_family: fastdis
    parallel_safe: false
    commands:
      - "{discover_command}"
  fastdis-doctor:
    id: "{route_id}-doctor"
    label: "{route_label} Doctor"
    stage: evidence
    route_family: fastdis
    parallel_safe: false
    commands:
      - "{doctor_command}"
  fastdis-build:
    id: "{route_id}-build"
    label: "{route_label} Build"
    stage: build-proof
    route_family: fastdis
    parallel_safe: false
    commands:
      - "{build_command}"
  fastdis-verify:
    id: "{route_id}-verify"
    label: "{route_label} Verify"
    stage: runtime-proof
    route_family: fastdis
    parallel_safe: false
    commands:
      - "{verify_command}"
  fastdis-demo:
    id: "{route_id}-demo"
    label: "{route_label} Demo"
    stage: demo-proof
    route_family: fastdis
    parallel_safe: false
    commands:
      - "{demo_command}"
  fastdis-full:
    id: "{route_id}-full"
    label: "{route_label} Full"
    stage: full
    route_family: fastdis
    parallel_safe: false
    commands:
      - "{full_command}"
  workspace-doctor:
    id: "{route_id}-doctor"
    label: "{route_label} Doctor"
    stage: evidence
    route_family: default
    parallel_safe: false
    commands:
      - "{doctor_command}"
  workspace-full:
    id: "{route_id}-full"
    label: "{route_label} Full"
    stage: full
    route_family: default
    parallel_safe: false
    commands:
      - "{full_command}"
  workspace-verify:
    id: "{route_id}-verify"
    label: "{route_label} Verify"
    stage: verify
    route_family: default
    parallel_safe: false
    commands:
      - "{verify_command}"
  fastdis-package-proof:
    id: "{task_id}"
    label: "{task_label}"
    stage: package-proof
    route_family: fastdis
    parallel_safe: true
    commands:
      - "{package_proof_command}"
    artifacts:
      - "{package_proof_json}"
      - "{package_proof_md}"
  grill-package-proof:
    id: "{task_id}"
    label: "{task_label}"
    stage: package-proof
    route_family: grill-dis
    parallel_safe: true
    commands:
      - "{package_proof_command}"
    artifacts:
      - "{package_proof_json}"
      - "{package_proof_md}"

surfaces:
  - id: python
    label: Python
    preferred_version: "3.14"
    supported_versions:
      - version: "3.12"
        status: supported
        notes: Oldest supported Python lane for the workspace.
      - version: "3.13"
        status: supported
      - version: "3.14"
        status: preferred
        notes: Primary dev/type-check baseline for the workspace.
    package_paths:
      - src/fastdis
    example_paths:
      - examples
    proof_kinds:
      - build-proof
      - integration-proof
    hooks:
      discover:
        status: unsupported
        notes: Python does not require an engine install discovery phase.
      doctor:
        status: supported
        command: fastdis doctor
      bootstrap:
        status: unsupported
        notes: Python core does not require an engine bootstrap lane.
      build:
        status: supported
        command: python -m pytest
        notes: Python validation is package-and-test driven on this surface.
      verify:
        status: supported
        command: python -m pytest
      demo:
        status: unsupported
        notes: Python core has no engine demo scene.
      full:
        status: supported
        command: python -m pytest
      package:
        status: partial
        command: python -m build
        notes: Packaging exists, but this surface is primarily exercised via editable dev/test flow.
        requirements:
          - requirement_kind: interpreter
            version_policy: exact-abi
            supported_versions: ["3.14"]
            reason: Wheel/native packaging is ABI-bound and should run on the preferred CPython 3.14 lane.
            blocking: true
            remediation:
              - Use CPython 3.14 when running python -m build for native-wheel style packaging lanes.
      install-smoke:
        status: unsupported
        notes: Python core does not have a separate engine install-smoke lane.
  - id: lattice
    label: Lattice
    preferred_version: "0.15.0a5"
    supported_versions:
      - version: "0.15.0a5"
        status: preferred
        notes: Current packet-stoat-lattice adapter package lane.
    package_paths:
      - packages/lattice/src/packet_stoat_lattice
    example_paths:
      - packages/lattice/examples
    proof_kinds:
      - integration-proof
      - runtime-proof
      - packaging
    hooks:
      discover:
        status: supported
        command: fastdis-lattice discover
        notes: Discover the adapter-owned fixtures, backend config, and surrogate inputs.
      doctor:
        status: supported
        command: fastdis-lattice doctor
        notes: Lattice is adapter-owned and verified through mock, surrogate, and credential-gated live lanes.
      bootstrap:
        status: unsupported
        notes: The adapter package does not require a separate workspace bootstrap lane today.
      build:
        status: supported
        command: python -m build packages/lattice
        notes: Build the packet-stoat-lattice package artifact surface.
      verify:
        status: supported
        command: fastdis-lattice verify
        notes: Verification runs against adapter-owned proof artifacts with Zorn-compatible surrogate coverage.
      demo:
        status: supported
        command: fastdis-lattice showcase
        notes: The showcase lane is the surrogate-first demo surface for ingress and egress behavior.
      full:
        status: supported
        command: fastdis-lattice full
      package:
        status: supported
        command: python -m build packages/lattice
      install-smoke:
        status: unsupported
        notes: The adapter package does not expose an install-smoke lane separate from package build and proof runs.
  - id: unity
    label: Unity
    preferred_version: "6000.5"
    supported_versions:
      - version: "6000.5"
        status: preferred
        notes: Current primary Unity proof lane for native/plugin verification.
    package_paths:
      - packages/unity/com.sheepfling.fastdis
    example_paths:
      - packages/unity/com.sheepfling.fastdis
    proof_kinds:
      - build-proof
      - load-proof
      - runtime-proof
      - integration-proof
    hooks:
      discover:
        status: supported
        command: fastdis-engine unity discover --format json
      doctor:
        status: supported
        command: fastdis-engine unity doctor --unity-version {preferred_surface_version}
        requirements:
          - requirement_kind: engine
            engine: unity
            version_policy: exact-minor
            supported_versions: ["{preferred_surface_version}"]
            reason: Unity engine-scoped hooks are pinned to the current supported {preferred_surface_version} lane.
            blocking: true
            remediation:
              - Install Unity {preferred_surface_version} or point FASTDIS_UNITY_EDITOR at a {preferred_surface_version} editor build before running Unity hooks.
      bootstrap:
        status: unsupported
        notes: Unity currently uses discover/doctor/build flows rather than a dedicated bootstrap wrapper.
      build:
        status: supported
        command: fastdis-engine unity build --unity-version {preferred_surface_version}
        requirements:
          - requirement_kind: engine
            engine: unity
            version_policy: exact-minor
            supported_versions: ["{preferred_surface_version}"]
            reason: Unity build hooks are validated against the {preferred_surface_version} editor lane.
            blocking: true
            remediation:
              - Install Unity {preferred_surface_version} or point FASTDIS_UNITY_EDITOR at a {preferred_surface_version} editor build before running Unity hooks.
      verify:
        status: supported
        command: fastdis-engine unity runtime-verify --unity-version {preferred_surface_version}
        requirements:
          - requirement_kind: engine
            engine: unity
            version_policy: exact-minor
            supported_versions: ["{preferred_surface_version}"]
            reason: Unity runtime verification is version-tight to the {preferred_surface_version} editor lane.
            blocking: true
            remediation:
              - Install Unity {preferred_surface_version} or point FASTDIS_UNITY_EDITOR at a {preferred_surface_version} editor build before running Unity hooks.
      demo:
        status: supported
        command: fastdis-engine unity demo --unity-version {preferred_surface_version}
        requirements:
          - requirement_kind: engine
            engine: unity
            version_policy: exact-minor
            supported_versions: ["{preferred_surface_version}"]
            reason: Unity demo hooks are pinned to the {preferred_surface_version} editor lane.
            blocking: true
            remediation:
              - Install Unity {preferred_surface_version} or point FASTDIS_UNITY_EDITOR at a {preferred_surface_version} editor build before running Unity hooks.
      full:
        status: supported
        command: fastdis-engine unity full --unity-version {preferred_surface_version}
        requirements:
          - requirement_kind: engine
            engine: unity
            version_policy: exact-minor
            supported_versions: ["{preferred_surface_version}"]
            reason: Unity full hooks are pinned to the {preferred_surface_version} editor lane.
            blocking: true
            remediation:
              - Install Unity {preferred_surface_version} or point FASTDIS_UNITY_EDITOR at a {preferred_surface_version} editor build before running Unity hooks.
      package:
        status: partial
        command: fastdis-engine unity build --all-native
        notes: Packaging is tied to native matrix staging and UPM payload refresh rather than a dedicated package verb.
      install-smoke:
        status: supported
        command: fastdis-engine unity install-smoke --unity-version {preferred_surface_version}
        requirements:
          - requirement_kind: engine
            engine: unity
            version_policy: exact-minor
            supported_versions: ["{preferred_surface_version}"]
            reason: Unity install-smoke is version-tight to the {preferred_surface_version} editor lane.
            blocking: true
            remediation:
              - Install Unity {preferred_surface_version} or point FASTDIS_UNITY_EDITOR at a {preferred_surface_version} editor build before running Unity hooks.
  - id: godot
    label: Godot
    preferred_version: "4.7"
    supported_versions:
      - version: "4.7"
        status: preferred
        notes: Current stable Godot/GDExtension lane expected on developer hosts.
    package_paths:
      - packages/godot/fastdis_gdextension
    example_paths:
      - packages/godot/fastdis_demo
      - packages/godot/fastdis_orientation_verification
    proof_kinds:
      - build-proof
      - load-proof
      - runtime-proof
      - integration-proof
    hooks:
      discover:
        status: supported
        command: fastdis-engine godot discover
      doctor:
        status: supported
        command: fastdis-engine godot doctor
      bootstrap:
        status: supported
        command: fastdis-engine godot bootstrap
      build:
        status: supported
        command: fastdis-engine godot build
      verify:
        status: supported
        command: fastdis-engine godot verify
      demo:
        status: supported
        command: fastdis-engine godot demo
      full:
        status: supported
        command: fastdis-engine godot full
      package:
        status: partial
        command: fastdis-engine godot build
        notes: Packaging is currently folded into build/staging rather than a dedicated package verb.
      install-smoke:
        status: unsupported
        notes: Godot currently relies on doctor/bootstrap/build verification instead of a separate install-smoke lane.
  - id: cesium-godot
    label: Cesium Godot
    preferred_version: "4.7"
    supported_versions:
      - version: "4.7"
        status: preferred
        notes: Current preferred Godot lane for local compatibility checks.
    package_paths:
      - artifacts/reports/godot_vendor_plugin
    proof_kinds:
      - build-proof
      - install-proof
    hooks:
      discover:
        status: supported
        command: python tools/godot_vendor_workflow.py discover
      doctor:
        status: supported
        command: python tools/godot_vendor_workflow.py doctor --vendor cesium-godot
        notes: Checks the configured 3D-Tiles-For-Godot checkout structure plus the discovered Godot version against the upstream minimum.
        requirements:
          - requirement_kind: env
            name: FASTDIS_CESIUM_GODOT_PLUGIN_ROOT
            reason: Cesium Godot checking needs a plugin checkout root to inspect.
            blocking: true
            remediation:
              - Set FASTDIS_CESIUM_GODOT_PLUGIN_ROOT to the local 3D-Tiles-For-Godot checkout root.
      bootstrap:
        status: unsupported
        notes: This selective Godot vendor route does not own bootstrap/build lanes.
      build:
        status: unsupported
        notes: This selective Godot vendor route currently checks version/layout compatibility only.
      verify:
        status: unsupported
        notes: This selective Godot vendor route currently checks version/layout compatibility only.
      demo:
        status: unsupported
        notes: This selective Godot vendor route currently checks version/layout compatibility only.
      full:
        status: supported
        command: python tools/godot_vendor_workflow.py doctor --vendor cesium-godot
        notes: The current full route is the compatibility doctor because no separate runnable proof lane exists yet.
        requirements:
          - requirement_kind: env
            name: FASTDIS_CESIUM_GODOT_PLUGIN_ROOT
            reason: Cesium Godot checking needs a plugin checkout root to inspect.
            blocking: true
            remediation:
              - Set FASTDIS_CESIUM_GODOT_PLUGIN_ROOT to the local 3D-Tiles-For-Godot checkout root.
      package:
        status: unsupported
        notes: This selective Godot vendor route does not package the vendor plugin.
      install-smoke:
        status: unsupported
        notes: This selective Godot vendor route does not yet create a scratch-project import smoke lane.
  - id: cesium-unity
    label: Cesium Unity
    preferred_version: "6000.5"
    supported_versions:
      - version: "6000.5"
        status: preferred
        notes: Current preferred Cesium Unity vendor lane for scratch-project package import and compile proof.
    package_paths:
      - artifacts/reports/unity_vendor_plugin
    proof_kinds:
      - build-proof
      - install-proof
    hooks:
      discover:
        status: supported
        command: python tools/unity_vendor_workflow.py discover
      doctor:
        status: supported
        command: python tools/unity_vendor_workflow.py doctor --vendor cesium-unity --unity-version {preferred_surface_version}
        notes: Checks the configured cesium-unity checkout structure plus the selected Unity Editor lane.
        requirements:
          - requirement_kind: env
            name: FASTDIS_CESIUM_UNITY_PLUGIN_ROOT
            reason: Cesium Unity vendor checking needs a plugin checkout root to inspect.
            blocking: true
            remediation:
              - Set FASTDIS_CESIUM_UNITY_PLUGIN_ROOT to the local cesium-unity checkout root.
          - requirement_kind: engine
            engine: unity
            version_policy: exact-minor
            supported_versions: ["{preferred_surface_version}"]
            reason: The Cesium Unity vendor lane is pinned to the selected Unity proof lane.
            blocking: true
            remediation:
              - Install Unity Editor {preferred_surface_version} or point FASTDIS_UNITY_EDITOR at a matching editor.
      bootstrap:
        status: unsupported
        notes: This selective Unity vendor route does not own a separate bootstrap lane.
      build:
        status: supported
        command: python tools/unity_vendor_workflow.py build --vendor cesium-unity --unity-version {preferred_surface_version}
        notes: Creates a scratch Unity project that imports the local cesium-unity package and proves package compilation/import.
        requirements:
          - requirement_kind: env
            name: FASTDIS_CESIUM_UNITY_PLUGIN_ROOT
            reason: Cesium Unity import smoke needs a local package checkout.
            blocking: true
            remediation:
              - Set FASTDIS_CESIUM_UNITY_PLUGIN_ROOT to the local cesium-unity checkout root.
          - requirement_kind: engine
            engine: unity
            version_policy: exact-minor
            supported_versions: ["{preferred_surface_version}"]
            reason: The Cesium Unity vendor compile lane is pinned to the selected Unity proof lane.
            blocking: true
            remediation:
              - Install Unity Editor {preferred_surface_version} or point FASTDIS_UNITY_EDITOR at a matching editor.
      verify:
        status: unsupported
        notes: This selective Unity vendor route currently stops at package import/compile proof.
      demo:
        status: unsupported
        notes: This selective Unity vendor route does not own a scene/demo lane.
      full:
        status: supported
        command: python tools/unity_vendor_workflow.py full --vendor cesium-unity --unity-version {preferred_surface_version}
        notes: Runs doctor plus scratch-project package import/compile smoke.
        requirements:
          - requirement_kind: env
            name: FASTDIS_CESIUM_UNITY_PLUGIN_ROOT
            reason: Cesium Unity vendor proof needs a local package checkout.
            blocking: true
            remediation:
              - Set FASTDIS_CESIUM_UNITY_PLUGIN_ROOT to the local cesium-unity checkout root.
          - requirement_kind: engine
            engine: unity
            version_policy: exact-minor
            supported_versions: ["{preferred_surface_version}"]
            reason: The Cesium Unity full lane is pinned to the selected Unity proof lane.
            blocking: true
            remediation:
              - Install Unity Editor {preferred_surface_version} or point FASTDIS_UNITY_EDITOR at a matching editor.
      package:
        status: unsupported
        notes: Unity vendor proof is expressed as import/compile smoke rather than a separate package verb.
      install-smoke:
        status: supported
        command: python tools/unity_vendor_workflow.py build --vendor cesium-unity --unity-version {preferred_surface_version}
        notes: Alias of the scratch-project package import/compile smoke.
  - id: cesium-unreal-example
    label: Cesium Unreal Example
    preferred_version: "5.7"
    supported_versions:
      - version: "5.7"
        status: preferred
        notes: Primary pure-Cesium example-project target for Unreal.
      - version: "5.8"
        status: supported
        notes: Secondary Unreal example lane once the same Cesium scene contract is proven there.
    example_paths:
      - extensions/cesium/docs/CESIUM_EXAMPLE_STANDARD.md
      - extensions/cesium/docs/CESIUM_SOURCE_ROUTE.md
    proof_kinds:
      - demo-proof
      - install-proof
      - runtime-proof
    hooks:
      discover:
        status: supported
        command: python extensions/cesium/tools/cesium_example_workflow.py discover --engine unreal
      doctor:
        status: supported
        command: python extensions/cesium/tools/cesium_example_workflow.py doctor --engine unreal
        notes: Tracks readiness for a repo-owned pure-Cesium Unreal example project separately from the vendor plugin lane.
      bootstrap:
        status: unsupported
        notes: The example-project bootstrap still needs a dedicated project materialization lane.
      build:
        status: partial
        notes: The pure-Cesium Unreal example scaffold now exists, but live scene/runtime automation is still pending.
      verify:
        status: unsupported
        notes: Runtime verification will land after the example project exists.
      demo:
        status: unsupported
        notes: Demo automation will land after the example project exists.
      full:
        status: supported
        command: python extensions/cesium/tools/cesium_example_workflow.py full --engine unreal
        notes: Writes a Cesium example readiness report and records the prerequisite vendor/example commands for the Unreal lane.
      package:
        status: unsupported
        notes: Example packaging is deferred until the project exists.
      install-smoke:
        status: unsupported
        notes: Example install smoke is deferred until the project exists.
  - id: cesium-unity-example
    label: Cesium Unity Example
    preferred_version: "6000.5"
    supported_versions:
      - version: "6000.5"
        status: preferred
        notes: Primary pure-Cesium example-project target for Unity.
    example_paths:
      - extensions/cesium/docs/CESIUM_EXAMPLE_STANDARD.md
      - extensions/cesium/docs/CESIUM_SOURCE_ROUTE.md
    proof_kinds:
      - demo-proof
      - install-proof
      - runtime-proof
    hooks:
      discover:
        status: supported
        command: python extensions/cesium/tools/cesium_example_workflow.py discover --engine unity
      doctor:
        status: supported
        command: python extensions/cesium/tools/cesium_example_workflow.py doctor --engine unity
        notes: Tracks readiness for a repo-owned pure-Cesium Unity example project separately from generic Unity lanes.
      bootstrap:
        status: unsupported
        notes: The example-project bootstrap still needs a dedicated Unity project materialization lane.
      build:
        status: partial
        notes: The pure-Cesium Unity example scaffold now exists, but live scene/runtime automation is still pending.
      verify:
        status: unsupported
        notes: Runtime verification will land after the example project exists.
      demo:
        status: unsupported
        notes: Demo automation will land after the example project exists.
      full:
        status: supported
        command: python extensions/cesium/tools/cesium_example_workflow.py full --engine unity
        notes: Writes a Cesium example readiness report and records the prerequisite vendor/example commands for the Unity lane.
      package:
        status: unsupported
        notes: Example packaging is deferred until the project exists.
      install-smoke:
        status: unsupported
        notes: Example install smoke is deferred until the project exists.
  - id: cesium-godot-example
    label: Cesium Godot Example
    preferred_version: "4.7"
    supported_versions:
      - version: "4.7"
        status: preferred
        notes: Primary pure-Cesium example-project target for Godot.
    example_paths:
      - extensions/cesium/docs/CESIUM_EXAMPLE_STANDARD.md
      - extensions/cesium/docs/CESIUM_SOURCE_ROUTE.md
    proof_kinds:
      - demo-proof
      - install-proof
      - runtime-proof
    hooks:
      discover:
        status: supported
        command: python extensions/cesium/tools/cesium_example_workflow.py discover --engine godot
      doctor:
        status: supported
        command: python extensions/cesium/tools/cesium_example_workflow.py doctor --engine godot
        notes: Tracks readiness for a repo-owned pure-Cesium Godot example project separately from the Godot vendor lane.
      bootstrap:
        status: unsupported
        notes: The example-project bootstrap still needs a dedicated Godot project materialization lane.
      build:
        status: partial
        notes: The pure-Cesium Godot example scaffold now exists, but live scene/runtime automation is still pending.
      verify:
        status: unsupported
        notes: Runtime verification will land after the example project exists.
      demo:
        status: unsupported
        notes: Demo automation will land after the example project exists.
      full:
        status: supported
        command: python extensions/cesium/tools/cesium_example_workflow.py full --engine godot
        notes: Writes a Cesium example readiness report and records the prerequisite vendor/example commands for the Godot lane.
      package:
        status: unsupported
        notes: Example packaging is deferred until the project exists.
      install-smoke:
        status: unsupported
        notes: Example install smoke is deferred until the project exists.
  - id: unreal
    label: Unreal
    preferred_version: "5.7"
    supported_versions:
      - version: "5.7"
        status: preferred
        notes: Current preferred GRILL-compatible lane while upstream sample dependencies catch up on 5.8.
      - version: "5.8"
        status: supported
